<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naiara Bedin · Desenvolvedora de Software</title>
    <meta
      name="description"
      content="Desenvolvedora de Software: Flutter (Android e iOS), pagamentos TEF/POS e IoT. Conecto aplicativos a maquininhas, totens, lockers e dispositivos IoT."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Aplica o tema salvo antes da pintura, para não piscar.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
